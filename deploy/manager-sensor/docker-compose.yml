# Local sidecar deployment. Sensor has NO network interface other than loopback,
# and its own irreversible seccomp filter also denies all non-Unix socket creation.
x-hardening: &hardening
  image: "${ALTERHIVE_IMAGE:-alterhive:split}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 512m
  tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
  restart: unless-stopped
services:
  manager:
    <<: *hardening
    user: "10001:20000"
    environment:
      ALTERHIVE_ROLE: manager
      CONFIG_DIR: /app/configs
      ALTERHIVE_DECISION_SOCKET: /run/alterhive/decisions/decision.sock
      ALTERHIVE_SENSOR_UID: "10002"
      ALTERHIVE_ALLOW_LLM_NETWORK: "true"
      ALTERHIVE_LLM_CONFIG_READ_ONLY: "true"
      ALTERHIVE_ADMIN_ADDR: ":8110"
      ALTERHIVE_ADMIN_TOKEN: ${ALTERHIVE_ADMIN_TOKEN:?generate an independent manager admin token}
    env_file: [./manager.env]
    volumes:
      - ./manager-configs:/app/configs:ro
      - decisions:/run/alterhive/decisions
    ports: ["${MANAGER_API_PUBLISH:-127.0.0.1:8110}:8110"]
    networks: [ops]

  sensor:
    <<: *hardening
    user: "10002:20000"
    network_mode: none
    environment:
      ALTERHIVE_ROLE: sensor
      CONFIG_DIR: /app/configs
      ALTERHIVE_DECISION_SOCKET: /run/alterhive/decisions/decision.sock
      ALTERHIVE_SSH_SOCKET: /run/alterhive/ingress/ssh.sock
      ALTERHIVE_API_SOCKET: /run/alterhive/ingress/api.sock
      ALTERHIVE_INGRESS_UID: "10003"
      ALTERHIVE_ALLOW_LLM_CONTEXT_EXPORT: "true"
    volumes:
      - ./sensor-configs:/app/configs:ro
      - decisions:/run/alterhive/decisions:ro
      - ingress:/run/alterhive/ingress
    depends_on: [manager]

  ingress:
    <<: *hardening
    user: "10003:20000"
    environment:
      ALTERHIVE_ROLE: ingress
      SSH_ADDR: ":2222"
      API_ADDR: ":8000"
      ALTERHIVE_ADMIN_TOKEN: ${ALTERHIVE_SENSOR_ADMIN_TOKEN:?generate an independent ingress admin token}
    volumes:
      - ingress:/run/alterhive/ingress:ro
    ports:
      - "${SENSOR_SSH_PUBLISH:-127.0.0.1:2222}:2222"
      - "${SENSOR_API_PUBLISH:-127.0.0.1:8000}:8000"
    networks: [edge]
    depends_on: [sensor]

  frontend:
    profiles: [ui]
    build: ../../frontend
    ports: ["${FRONTEND_PUBLISH:-127.0.0.1:3000}:80"]
    networks: [edge, ops]
    depends_on: [ingress, manager]

volumes:
  decisions:
  ingress:
networks:
  # Published ports must work on Docker Desktop too. Only the LLM-credential-free
  # TCP ingress attaches here; the sensor remains network_mode:none.
  edge:
  ops:
